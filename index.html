<style>
:root{--bg:#09090d;--card:#16161f;--pink:#ff46aa;--pink2:#ff78c8;--mag:#be28d2;--txt:#f2f2fa;--dim:#8787a0}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 50% -120px,rgba(255,70,170,.18),transparent),var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.08em;color:var(--pink2)}
.brand img{width:40px;height:40px}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;color:#fff;font:600 14px "Segoe UI",system-ui,sans-serif;padding:11px 20px;border-radius:12px;background:linear-gradient(90deg,var(--pink),var(--mag));transition:box-shadow .2s,transform .2s}
.btn:hover{box-shadow:0 0 22px rgba(255,70,170,.55);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--pink);color:var(--pink2)}
.hero{text-align:center;padding:56px 0 40px}
.hero h1{font-size:clamp(34px,7vw,60px);font-weight:800;background:linear-gradient(90deg,var(--pink2),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);margin:14px auto 0;max-width:520px;font-size:17px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:10px 0 60px}
.card{background:var(--card);border:1.5px solid rgba(255,70,170,.35);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--pink);box-shadow:0 0 26px rgba(255,70,170,.25);transform:translateY(-3px)}
.card h2{font-size:22px}
.card p{color:var(--dim);line-height:1.5;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--pink2);border:1px solid var(--pink);border-radius:999px;padding:3px 10px}
.cmd{background:#0d0d13;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;font:12px Consolas,monospace;color:#d8d8ea;overflow-x:auto;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.soon{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:200px}
footer{text-align:center;color:var(--dim);padding:30px 0 40px;border-top:1px solid rgba(255,255,255,.07)}
footer a{color:var(--pink2);text-decoration:none;font-weight:700}
</style>
</head>
<body>

<script>
/* ============================================================
   COMO AGREGAR UN PROYECTO:
   copia un bloque { ... } de abajo, pegalo al final de la lista
   (con una coma entre bloques) y cambia los textos.
   Campos opcionales: command, download, github
   ============================================================ */
var PROJECTS = [
  {
    name: "FignightTools",
    desc: "App portable para Windows: detecta tu PC y abre los drivers oficiales, instala Visual C++, DirectX, navegadores, Discord, Spotify y programas de gamer, con buscador.",
    tags: ["Windows", "Portable", "Drivers", "Gamer"],
    command: 'curl -L -o "%TEMP%\\FignightTools.exe" https://github.com/tj89893-creator/FignightTools/raw/main/FignightTools.exe && start "" "%TEMP%\\FignightTools.exe"',
    download: "https://github.com/tj89893-creator/FignightTools/raw/main/FignightTools.exe",
    github: "https://github.com/tj89893-creator/FignightTools"
  },
  {
    name: "CrosshairF1",
    desc: "Crosshair personalizable para Windows: muchas opciones para modificarlo, presets, guardado de tu mira, se minimiza a la bandeja y puede iniciar con Windows.",
    tags: ["Windows", "Portable", "Crosshair", "Gamer"],
    command: 'curl -L -o "%TEMP%\\CrosshairF1.exe" https://github.com/tj89893-creator/CrosshairF1/raw/main/CrosshairF1.exe && start "" "%TEMP%\\CrosshairF1.exe"',
    download: "https://github.com/tj89893-creator/CrosshairF1/raw/main/CrosshairF1.exe",
    github: "https://github.com/tj89893-creator/CrosshairF1"
  }
];

function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text) e.textContent = text; return e; }

var grid = document.getElementById("grid");
PROJECTS.forEach(function(p){
  var c = el("article", "card");
  c.appendChild(el("h2", "", p.name));
  c.appendChild(el("p", "", p.desc));
  if (p.tags) { var t = el("div", "tags"); p.tags.forEach(function(x){ t.appendChild(el("span", "tag", x)); }); c.appendChild(t); }
  if (p.command) {
    c.appendChild(el("p", "", "Instalar desde cmd:"));
    c.appendChild(el("div", "cmd", p.command));
  }
  var row = el("div", "row");
  if (p.command) {
    var cp = el("button", "btn", "Copiar comando");
    cp.onclick = function(){
      var done = function(){ cp.textContent = "¡Copiado!"; setTimeout(function(){ cp.textContent = "Copiar comando"; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(p.command).then(done);
      else { var ta = document.createElement("textarea"); ta.value = p.command; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
    };
    row.appendChild(cp);
  }
  if (p.download) { var d = el("a", "btn ghost", "Descargar"); d.href = p.download; row.appendChild(d); }
  if (p.github) { var g = el("a", "btn ghost", "GitHub"); g.href = p.github; g.target = "_blank"; g.rel = "noopener"; row.appendChild(g); }
  c.appendChild(row);
  grid.appendChild(c);
});

var soon = el("article", "card soon");
soon.appendChild(el("h2", "", "Próximamente"));
soon.appendChild(el("p", "", "Más proyectos en camino. Entrá al Discord para enterarte primero."));
grid.appendChild(soon);
</script>
